<foreignObject x="186" y="250" width="520" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:flex-start;font-size:16px;color:#101828"><span data-tex="(+3) + (-1) + (+1) + 0 + (-2) + (-1) = 0"></span></div></foreignObject>
<text x="450" y="304" font-size="14" fill="#667085" text-anchor="middle">평균은 편차의 합이 0이 되는 지점이다. 그래서 편차를 그냥 더해서는 흩어진 정도를 잴 수 없다</text>
