<foreignObject x="705" y="40" width="195" height="38"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:flex-start;font-size:13.5px;color:#16243F"><span data-tex="\mu"></span><span style="white-space:pre;font-weight:700;"> = M들의 평균</span></div></foreignObject>
<text x="693" y="284" font-size="13.5" fill="#667085" text-anchor="middle">표본평균 M이 쌓여 만든 분포</text>
<text x="450" y="344" font-size="15" fill="#101828" text-anchor="middle">표집분포는 사람들의 점수가 모인 분포가 아니라, 표본평균이라는 통계치가 모인 분포다</text>
<foreignObject x="70" y="345" width="760" height="39"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:center;font-size:14px;color:#101828"><span style="white-space:pre;">무한히 많은 </span><span data-tex="M_1,\, M_2,\, M_3,\, \ldots,\, M_\infty"></span><span style="white-space:pre;"> 를 모두 늘어놓으면 이 곡선이 된다</span></div></foreignObject>
<text x="450" y="392" font-size="14" fill="#344054" text-anchor="middle">실제로 그려본 적은 없지만, 그 모양을 알기 때문에 추론이 가능해진다</text>
</svg>
