<foreignObject x="255" y="150" width="90" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:center;font-size:13px;color:#C2452F"><span data-tex="\alpha = .05"></span></div></foreignObject>
<text x="215" y="198" font-size="14.5" fill="#C2452F" font-weight="800" text-anchor="middle">군집당 오류 .143 — 통제 실패</text>
<rect x="470" y="0" width="430" height="208" rx="10" fill="#FBFCFD" stroke="#0E7490" stroke-width="2.5"/>
<text x="685" y="34" font-size="16" fill="#0E7490" font-weight="800" text-anchor="middle">분산분석 한 번</text>
