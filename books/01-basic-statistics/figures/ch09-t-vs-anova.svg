<foreignObject x="535" y="90" width="300" height="48"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:center;font-size:17px;color:#101828"><span data-tex="H_0 : \mu_A = \mu_B = \mu_C"></span></div></foreignObject>
<text x="685" y="134" font-size="13" fill="#344054" text-anchor="middle">세 평균이 모두 같은가?</text>
<text x="685" y="198" font-size="14.5" fill="#0E7490" font-weight="800" text-anchor="middle">군집당 오류 .05 — 유지</text>
<text x="450" y="246" font-size="14" fill="#101828" text-anchor="middle">대신 기각되어도 어느 집단끼리 다른지는 알려주지 않는다. 그 확인이 10장의 다중비교다</text>
