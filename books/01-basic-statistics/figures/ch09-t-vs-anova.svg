<foreignObject x="255" y="112" width="90" height="36"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:center;font-size:13px;color:#C2452F"><span data-tex="\alpha = .05"></span></div></foreignObject>
<rect x="90" y="148" width="250" height="30" rx="6" fill="#FBEAE6" stroke="#C2452F" stroke-width="1.6"/>
