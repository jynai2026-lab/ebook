<svg viewBox="0 0 900 260" font-family="Pretendard, sans-serif" xmlns="http://www.w3.org/2000/svg">
<path d="M80,118 L820,118" stroke="#E4E7EC" stroke-width="5" stroke-linecap="round"/>
<path d="M80,118 L60,118" stroke="#667085" stroke-width="2"/><path d="M68.0,113.0 L60.0,118.0 L68.0,123.0" fill="none" stroke="#667085" stroke-width="2"/>
<path d="M820,118 L840,118" stroke="#667085" stroke-width="2"/><path d="M832.0,123.0 L840.0,118.0 L832.0,113.0" fill="none" stroke="#667085" stroke-width="2"/>
<text x="60" y="88" font-size="14" fill="#C2452F" font-weight="800">느슨함</text>
<text x="840" y="88" font-size="14" fill="#16243F" font-weight="800" text-anchor="end">엄격함</text>
<text x="60" y="106" font-size="12.5" fill="#667085">차이를 잘 찾지만 헛발견도 는다</text>
<text x="840" y="106" font-size="12.5" fill="#667085" text-anchor="end">헛발견은 적지만 놓치기 쉽다</text>
<circle cx="150" cy="118" r="11" fill="#C2452F" stroke="#fff" stroke-width="3"/>
<text x="150" y="158" font-size="15" fill="#C2452F" font-weight="800" text-anchor="middle">Fisher LSD</text>
<text x="150" y="178" font-size="12.5" fill="#667085" text-anchor="middle">집단 3개일 때만</text>
<circle cx="370" cy="118" r="11" fill="#0E7490" stroke="#fff" stroke-width="3"/>
<text x="370" y="158" font-size="15" fill="#0E7490" font-weight="800" text-anchor="middle">Tukey HSD</text>
<text x="370" y="178" font-size="12.5" fill="#667085" text-anchor="middle">기본 선택지</text>
<circle cx="580" cy="118" r="11" fill="#B54708" stroke="#fff" stroke-width="3"/>
<text x="580" y="158" font-size="15" fill="#B54708" font-weight="800" text-anchor="middle">Bonferroni</text>
<text x="580" y="178" font-size="12.5" fill="#667085" text-anchor="middle">비교가 적을 때</text>
<circle cx="790" cy="118" r="11" fill="#16243F" stroke="#fff" stroke-width="3"/>
<text x="790" y="158" font-size="15" fill="#16243F" font-weight="800" text-anchor="middle">Scheffé</text>
<text x="790" y="178" font-size="12.5" fill="#667085" text-anchor="middle">복합 비교 포함</text>
<rect x="300" y="190" width="140" height="24" rx="12" fill="#ECF7F9" stroke="#0E7490" stroke-width="1.6"/>
<text x="370" y="207" font-size="12" fill="#0E7490" font-weight="700" text-anchor="middle">특별한 사정 없으면 이것</text>
<text x="450" y="42" font-size="17" fill="#101828" text-anchor="middle">사후검정 방법의 보수성</text>
<text x="450" y="248" font-size="14" fill="#344054" text-anchor="middle">분석을 마친 뒤에 유의하게 나오는 방법을 고르는 것은 유의성 낚시다. 미리 정해두어야 한다</text>
</svg>
