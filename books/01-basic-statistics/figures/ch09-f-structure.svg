<svg viewBox="0 0 900 250" font-family="Pretendard, sans-serif" xmlns="http://www.w3.org/2000/svg">
<text x="450" y="54" font-size="26" fill="#16243F" font-weight="800" text-anchor="end">F  =</text>
<rect x="466" y="30" width="330" height="40" rx="8" fill="#ECF7F9" stroke="#0E7490" stroke-width="2"/>
<text x="631" y="56" font-size="15" fill="#0E7490" font-weight="800" text-anchor="middle">집단 간 분산 = 처치효과 + 개인차</text>
<path d="M466,82 L796,82" stroke="#16243F" stroke-width="2.6"/>
<rect x="466" y="94" width="330" height="40" rx="8" fill="#FBEAE6" stroke="#C2452F" stroke-width="2"/>
<text x="631" y="120" font-size="15" fill="#C2452F" font-weight="800" text-anchor="middle">집단 내 분산 = 개인차</text>
<text x="190" y="56" font-size="14" fill="#344054" font-weight="700">처치효과가 0이면</text>
<text x="190" y="80" font-size="14" fill="#344054" font-weight="700">분자와 분모가 같아져</text>
<text x="190" y="104" font-size="15" fill="#16243F" font-weight="800">F = 1 이 된다</text>
<text x="190" y="132" font-size="13.5" fill="#667085">F가 1보다 충분히 크면</text>
<text x="190" y="152" font-size="13.5" fill="#667085">개인차만으로는 설명되지</text>
<text x="190" y="172" font-size="13.5" fill="#667085">않는 무언가가 있다는 뜻</text>
<rect x="466" y="152" width="330" height="54" rx="8" fill="#FBFCFD" stroke="#E4E7EC" stroke-width="2"/>
<text x="631" y="176" font-size="14" fill="#101828" font-weight="700" text-anchor="middle">교수법 자료:  F = 209.43 / 11.56</text>
<text x="631" y="196" font-size="15" fill="#16243F" font-weight="800" text-anchor="middle">= 18.12</text>
<text x="450" y="238" font-size="14" fill="#344054" text-anchor="middle">7장에서 t값을 "관찰된 차이 ÷ 그 차이가 변동하는 정도"로 읽었던 것과 같은 구조다</text>
</svg>
