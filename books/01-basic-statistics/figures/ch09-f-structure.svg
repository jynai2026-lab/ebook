<svg viewBox="0 0 900 262" font-family="Pretendard, sans-serif" xmlns="http://www.w3.org/2000/svg">
<foreignObject x="354" y="20" width="90" height="73"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:flex-end;font-size:26px;color:#16243F"><span data-tex="F ="></span></div></foreignObject>
<rect x="466" y="30" width="330" height="40" rx="8" fill="#ECF7F9" stroke="#0E7490" stroke-width="2"/>
<text x="631" y="56" font-size="15" fill="#0E7490" font-weight="800" text-anchor="middle">집단 간 분산 = 처치효과 + 개인차</text>
<path d="M466,82 L796,82" stroke="#16243F" stroke-width="2.6"/>
<rect x="466" y="94" width="330" height="40" rx="8" fill="#FBEAE6" stroke="#C2452F" stroke-width="2"/>
<text x="631" y="120" font-size="15" fill="#C2452F" font-weight="800" text-anchor="middle">집단 내 분산 = 개인차</text>
<text x="190" y="56" font-size="14" fill="#344054" font-weight="700">처치효과가 0이면</text>
<text x="190" y="80" font-size="14" fill="#344054" font-weight="700">분자와 분모가 같아져</text>
<foreignObject x="190" y="82" width="70" height="42"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:flex-start;font-size:15px;color:#16243F"><span data-tex="F = 1"></span></div></foreignObject>
<text x="245" y="108" font-size="15" fill="#16243F" font-weight="800">이 된다</text>
<text x="190" y="134" font-size="13.5" fill="#667085">F가 1보다 충분히 크면</text>
<text x="190" y="152" font-size="13.5" fill="#667085">개인차만으로는 설명되지</text>
<text x="190" y="172" font-size="13.5" fill="#667085">않는 무언가가 있다는 뜻</text>
<rect x="466" y="152" width="330" height="62" rx="8" fill="#FBFCFD" stroke="#E4E7EC" stroke-width="2"/>
<text x="631" y="172" font-size="13" fill="#667085" font-weight="700" text-anchor="middle">교수법 자료</text>
<foreignObject x="481" y="172" width="300" height="45"><div xmlns="http://www.w3.org/1999/xhtml" class="figtex" style="justify-content:center;font-size:16px;color:#101828"><span data-tex="F = \dfrac{209.43}{11.56} = 18.12"></span></div></foreignObject>
<text x="450" y="250" font-size="14" fill="#344054" text-anchor="middle">7장에서 t값을 "관찰된 차이 ÷ 그 차이가 변동하는 정도"로 읽었던 것과 같은 구조다</text>
