<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/shorts.css">
<script src="../../lib/shorts-kit.js"></script>
<script>
const { g, T, box, C, SAFE, CX, ease } = Shorts;

// 5장 power.t.test(n, delta = 0.5, sd = 1, sig.level = .05) 실행값
const ROWS = [[20, .338], [30, .478], [50, .697], [64, .801], [100, .940]];

Shorts.run(({ sec, on, at, beat }) => {
  // 막대 장면으로 넘어가면 앞 장면은 걷어낸다
  const B = at('bars', 0.5);
  const A = 1 - B;

  /* ---------------- 앞 장면: 질문 → 검정력 → 놓치는 몫 ---------------- */
  if (A > 0) {
    const h = at('hook', 0.5);
    g.globalAlpha = A * h;
    T('각 집단 30명이면', CX, 450 - 16 * (1 - h), 74, C.NAVY, 800);
    T('충분하다고요?', CX, 540 - 16 * (1 - h), 74, C.NAVY, 800);

    if (on('power')) {
      const a = at('power', 0.4), fill = at('power', 1.6);
      g.globalAlpha = A * a;
      T('이 설계의 검정력', CX, 668, 36, C.SOFT, 600);
      T((0.478 * fill).toFixed(3), CX, 808, 140, C.CORAL, 800);
      const gx = SAFE.left + 30, gw = SAFE.right - SAFE.left - 60, gy = 848, gh = 42;
      box(gx, gy, gw, gh, 21, C.RULE);
      box(gx, gy, Math.max(gh, gw * 0.478 * fill), gh, 21, C.CORAL);

      if (on('miss')) {
        const m = at('miss', 0.5);
        const x0 = gx + gw * 0.478, w0 = gw * (1 - 0.478);
        g.save();
        g.beginPath(); g.roundRect(x0, gy, w0, gh, 21); g.clip();
        g.strokeStyle = C.CORAL; g.lineWidth = 4; g.globalAlpha = A * m * 0.55;
        for (let x = x0 - 50; x < x0 + w0 + 50; x += 18) {
          g.beginPath(); g.moveTo(x, gy + gh); g.lineTo(x + gh, gy); g.stroke();
        }
        g.restore();
        g.globalAlpha = A * m;
        T('놓치는 52%', x0 + w0 / 2, gy + 100, 44, C.CORAL, 800);
      }
    }
    g.globalAlpha = 1;
  }

  /* ---------------- 뒤 장면: 인원을 늘리면 ---------------- */
  if (B > 0) {
    g.globalAlpha = B;
    T('각 집단 30명이면 충분하다고요?', CX, 404, 48, C.NAVY, 800);

    const bx = SAFE.left + 176, bw = 530, y0 = 610, rh = 104, bh = 56;
    const lx = bx + bw * 0.8;
    const why = on('why') ? at('why', 0.5) : 0;

    // 표본크기가 연구자 몫이라는 것을 마지막 문장에서 짚는다
    const label = why > 0 ? '집단당 인원 = 연구자가 정하는 값' : '집단당 인원';
    T(label, SAFE.left, 520, 34, why > 0 ? C.TEAL : C.SOFT, 700, 'left');
    if (why > 0) {
      g.globalAlpha = B * why;
      box(SAFE.left - 8, y0 - 52, 176, rh * 4 + 84, 16, null, C.TEAL, 4);
      g.globalAlpha = B;
    }

    g.strokeStyle = C.NAVY; g.lineWidth = 3; g.setLineDash([12, 9]);
    g.beginPath(); g.moveTo(lx, y0 - 60); g.lineTo(lx, y0 + rh * 4 + 40); g.stroke();
    g.setLineDash([]);
    T('기준 0.8', lx, y0 - 72, 30, C.NAVY, 700);

    const start = beat('bars').start;
    ROWS.forEach(([n, p], k) => {
      const grow = ease((sec - start - 0.3 - k * 0.32) / 0.7);
      const y = y0 + k * rh;
      const hit = n === 64 && on('answer');
      const pop = hit ? at('answer', 0.4) : 0;

      T(`n = ${n}`, bx - 22, y + 14, 40, n === 64 && pop ? C.TEAL : C.INK, 800, 'right');
      box(bx, y - bh / 2 - 6, bw, bh, 12, C.RULE);
      const color = n === 30 ? C.CORAL : p >= 0.8 ? C.TEAL : C.TEAL_LINE;
      box(bx, y - bh / 2 - 6, Math.max(12, bw * p * grow), bh, 12, color);
      if (grow > 0.6) T(p.toFixed(3), bx + bw + 18, y + 14, 38 + 8 * pop,
                        p >= 0.8 ? C.TEAL : n === 30 ? C.CORAL : C.SOFT, 800, 'left');
      if (pop > 0) {
        g.globalAlpha = B * pop;
        box(bx - 170, y - bh / 2 - 20, bw + 290, bh + 28, 18, null, C.TEAL, 5);
        g.globalAlpha = B;
      }
    });
    g.globalAlpha = 1;
  }
}, { tag: '통계, 왜 그렇게 하나' });
</script>
