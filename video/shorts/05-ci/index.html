<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="../../lib/shorts.css">
<script src="../../lib/shorts-kit.js"></script>
<script src="data.js"></script>
<script>
const { g, T, box, C, SAFE, CX, ease, clamp, strike, pill, measure, rise } = Shorts;
const MU = 3.5;
const CI = window.CISIM;                        // 6장 모의실험: 100개 중 97개가 μ를 포함
const hit = r => r.lo <= MU && MU <= r.hi;

Shorts.run(({ sec, on, at, beat }) => {
  const Bw = at('why', 0.5), Cr = at('right', 0.5);
  const A = 1 - Bw, B = Bw * (1 - Cr);

  /* ---------------- 흔한 해석 ---------------- */
  if (A > 0) {
    const dy = rise(A * at('hook', 0.5));
    T('95% 신뢰구간', CX, 560 + dy, 104, C.NAVY, 800);
    T('이렇게 말하면 틀립니다', CX, 668 + dy, 52, C.CORAL, 700);
    if (on('wrong')) {
      g.globalAlpha = A * at('wrong', 0.5);
      box(SAFE.left + 20, 770, SAFE.right - SAFE.left - 40, 190, 22, C.CORAL_TINT, C.CORAL, 4);
      T('"모평균이 이 구간 안에', CX, 845, 46, C.INK, 700);
      T('있을 확률이 95%다"', CX, 912, 46, C.INK, 700);
      g.globalAlpha = A * at('wrong', 1.2);
      pill('틀린 해석', CX, 770, 34, C.CORAL);
    }
    g.globalAlpha = 1;
  }

  /* ---------------- 모평균은 고정된 값 ---------------- */
  if (B > 0) {
    g.globalAlpha = B;
    const x0 = SAFE.left + 60, x1 = SAFE.right - 60;
    const sx = v => x0 + (v - 2.9) / (4.1 - 2.9) * (x1 - x0);
    g.strokeStyle = C.NAVY; g.lineWidth = 5;
    g.beginPath(); g.moveTo(sx(MU), 470); g.lineTo(sx(MU), 1000); g.stroke();
    T('모평균 μ — 정해진 값, 움직이지 않는다', CX, 440, 36, C.NAVY, 800);

    const rows = [[3.28, 3.72, true, '들어 있다'], [3.58, 3.98, false, '안 들어 있다']];
    rows.forEach(([lo, hi, ok, lab], k) => {
      const a = at('why', 0.6 + k * 0.5), y = 620 + k * 220;
      g.globalAlpha = B * a;
      const col = ok ? C.TEAL : C.CORAL;
      box(sx(lo), y - 20, sx(hi) - sx(lo), 40, 12, ok ? C.TEAL_TINT : C.CORAL_TINT, col, 4);
      g.fillStyle = col; g.beginPath(); g.arc((sx(lo) + sx(hi)) / 2, y, 9, 0, 7); g.fill();
      pill(lab, (sx(lo) + sx(hi)) / 2, y + 74, 34, col);
    });
    g.globalAlpha = B * at('why', 2.0);
    T('확률이 끼어들 자리가 없다: 둘 중 하나', CX, 1130, 38, C.INK, 700);
    g.globalAlpha = 1;
  }

  /* ---------------- 95%는 방법의 성공률 → 100번 해 보기 ---------------- */
  if (Cr > 0) {
    const D = on('demo') ? at('demo', 0.5) : 0;
    // 문장 하나일 때는 가운데 크게, 모의실험이 시작되면 위로 작게
    const big = 1 - D;
    g.globalAlpha = Cr * big;
    T('95%는 구간 하나가 아니라', CX, 640, 54, C.INK, 700);
    T('구간을 만드는 방법의 성공률', CX, 730, 58, C.TEAL, 800);

    if (D > 0) {
      g.globalAlpha = D;
      const x0 = SAFE.left + 40, x1 = SAFE.right - 40, top = 470, bot = 1110;
      const sx = v => x0 + (v - 2.48) / (4.52 - 2.48) * (x1 - x0);
      const b = beat('demo');
      // 문장 길이 안에서 100개가 차례로 그려진다
      const shown = Math.floor(100 * clamp((sec - b.start - 0.3) / Math.max(1, b.end - b.start - 0.8)));
      const rest = on('rest') ? at('rest', 0.5) : 0;
      let ok = 0;
      for (let i = 0; i < shown; i++) {
        const r = CI[i], y = top + (bot - top) * i / 99, good = hit(r);
        ok += good;
        g.strokeStyle = good ? 'rgba(14,116,144,.55)' : C.CORAL;
        g.lineWidth = good ? 3 : 5;
        g.beginPath(); g.moveTo(sx(r.lo), y); g.lineTo(sx(r.hi), y); g.stroke();
        if (!good && rest > 0) {
          g.globalAlpha = D * rest; g.strokeStyle = C.CORAL; g.lineWidth = 4;
          g.beginPath(); g.arc(r.lo > MU ? sx(r.hi) + 34 : sx(r.lo) - 34, y, 26, 0, 7); g.stroke();
          g.globalAlpha = D;
        }
      }
      g.strokeStyle = C.NAVY; g.lineWidth = 5;
      g.beginPath(); g.moveTo(sx(MU), top - 30); g.lineTo(sx(MU), bot + 20); g.stroke();
      T('μ', sx(MU), top - 42, 40, C.NAVY, 800);
      T('방법의 성공률', SAFE.left, 400, 40, C.TEAL, 800, 'left');
      T(`${ok} / ${shown}`, SAFE.right, 400, 48, C.NAVY, 800, 'right');
      if (rest > 0) { g.globalAlpha = D * rest; pill('예정된 5%', SAFE.right - 110, 1170, 34, C.CORAL); }
    }
    g.globalAlpha = 1;
  }
}, { tag: '통계, 왜 그렇게 하나' });
</script>
