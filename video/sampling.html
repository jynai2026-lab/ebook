<!doctype html><meta charset="utf-8">
<style>
  @font-face { font-family:'Pretendard'; src:url('../shared/fonts/PretendardVariable.woff2') format('woff2-variations');
               font-weight:45 920; font-display:block; }
  html,body { margin:0; background:#fff; }
  canvas { display:block; }
</style>
<canvas id="c" width="1280" height="720"></canvas>
<script>
const C = document.getElementById('c'), g = C.getContext('2d');
const INK='#101828', MID='#344054', SOFT='#667085', FAINT='#98A2B3';
const TEAL='#0E7490', TEAL_TINT='#ECF7F9', NAVY='#16243F', RULE='#E4E7EC';

// 재현 가능한 난수 (프레임마다 같은 그림이 나와야 한다)
let seed = 20260926;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };

// 모집단 점과, 미리 뽑아둔 표본들
const POP = Array.from({length:150}, () => ({x:rnd(), y:rnd()}));
const N_DRAW = 600, SAMPLE_N = 9;
const DRAWS = Array.from({length:N_DRAW}, () => {
  const idx = Array.from({length:SAMPLE_N}, () => Math.floor(rnd()*POP.length));
  // 모집단 x는 균등분포(SD = 1/√3)이므로, 9명 평균의 SD는 1/(√3·3).
  // 오른쪽 표준정규곡선과 폭을 맞추려면 그 역수를 곱해 표준화해야 한다.
  const SCALE = Math.sqrt(3) * Math.sqrt(SAMPLE_N);
  return { idx, m: idx.reduce((s,i)=>s+ (POP[i].x-0.5)*2, 0)/SAMPLE_N * SCALE };
});

const PX0=700, PX1=1230, BASE=470, TOPY=166;
const sx = v => PX0 + (PX1-PX0)*(v+3)/6;
const BINS = 34, binOf = v => Math.max(0, Math.min(BINS-1, Math.floor((v+3)/6*BINS)));

function text(s,x,y,size,color,weight,align){
  g.font = `${weight||400} ${size}px Pretendard, sans-serif`;
  g.fillStyle = color; g.textAlign = align||'left'; g.textBaseline='alphabetic';
  g.fillText(s,x,y);
}
const ease = t => t<0 ? 0 : t>1 ? 1 : t*t*(3-2*t);

window.renderFrame = function (t) {          // t: 0 .. 1
  g.clearRect(0,0,1280,720);
  g.fillStyle='#fff'; g.fillRect(0,0,1280,720);

  text('표집분포는 어떻게 만들어지는가', 60, 76, 34, NAVY, 800);
  text('같은 크기의 표본을 무한히 뽑아, 그 평균 M을 모은다', 60, 112, 19, SOFT, 500);

  // ---- 왼쪽: 모집단 ----
  g.strokeStyle=RULE; g.lineWidth=2;
  g.beginPath(); g.roundRect(60,150,430,320,14); g.stroke();
  text('모집단', 275, 186, 22, NAVY, 800, 'center');

  const done = Math.floor(ease(t/0.92) * N_DRAW);
  const cur = DRAWS[Math.min(done, N_DRAW-1)];
  const hot = new Set(cur.idx);
  POP.forEach((p,i) => {
    const px = 90 + p.x*370, py = 210 + p.y*230;
    g.beginPath(); g.arc(px,py, hot.has(i)?6:4, 0, 7);
    g.fillStyle = hot.has(i) ? TEAL : FAINT;
    g.globalAlpha = hot.has(i) ? 1 : .45; g.fill(); g.globalAlpha=1;
  });
  text(`지금 뽑은 표본 ${SAMPLE_N}명`, 275, 452, 15, TEAL, 700, 'center');

  // ---- 가운데: 이번 표본의 평균 ----
  const label = done < N_DRAW ? `M<sub>${done+1}</sub>` : 'M∞';
  g.strokeStyle=TEAL; g.lineWidth=2.5;
  g.beginPath(); g.roundRect(520,290,150,54,10); g.stroke();
  g.fillStyle=TEAL_TINT; g.fill();
  text(`M${done+1 > N_DRAW ? '∞' : ''}`, 595, 316, 17, TEAL, 800, 'center');
  text(cur.m.toFixed(2), 595, 336, 15, INK, 700, 'center');
  g.strokeStyle=RULE; g.lineWidth=2;
  g.beginPath(); g.moveTo(492,317); g.lineTo(516,317); g.stroke();
  g.beginPath(); g.moveTo(674,317); g.lineTo(PX0-8,317); g.stroke();

  // ---- 오른쪽: M이 쌓인다 ----
  const counts = new Array(BINS).fill(0);
  for (let i=0;i<done;i++) counts[binOf(DRAWS[i].m)]++;
  // 관측된 최대 막대에 맞추면 튀는 막대 하나 때문에 곡선을 넘어선다.
  // 이론상 기대 높이(정규밀도 × 구간폭 × 개수)로 재야 곡선과 눈금이 맞는다.
  const peak = Math.max(4, done * (6/BINS) * 0.3989);
  const bw = (PX1-PX0)/BINS;
  counts.forEach((c,i) => {
    if(!c) return;
    // 우연히 튀는 막대가 제목을 침범하지 않도록 곡선 꼭대기에서 멈춘다
    const h = Math.min(BASE-TOPY, (BASE-TOPY) * c/peak);
    g.fillStyle=TEAL; g.globalAlpha=.55;
    g.fillRect(PX0+i*bw+1, BASE-h, bw-2, h); g.globalAlpha=1;
  });

  // 충분히 쌓이면 정규곡선이 겹쳐 떠오른다
  const fade = ease((t-0.55)/0.3);
  if (fade > 0) {
    g.strokeStyle=NAVY; g.lineWidth=3; g.globalAlpha=fade;
    g.beginPath();
    for (let i=0;i<=200;i++){
      const v = -3 + 6*i/200;
      const y = BASE - (BASE-TOPY)*Math.exp(-v*v/2);
      i ? g.lineTo(sx(v), y) : g.moveTo(sx(v), y);
    }
    g.stroke(); g.globalAlpha=1;
  }
  g.strokeStyle=MID; g.lineWidth=2;
  g.beginPath(); g.moveTo(PX0-8,BASE); g.lineTo(PX1+8,BASE); g.stroke();
  text('표집분포', 965, 128, 22, NAVY, 800, 'center');
  text(`모은 표본평균 ${done}개`, 965, 500, 17, INK, 700, 'center');

  // ---- 아래 한 줄 설명 ----
  const beats = [
    [0.00,'① 모집단에서 같은 크기의 표본을 뽑는다'],
    [0.22,'② 그 표본의 평균 M을 하나 구한다'],
    [0.45,'③ 이것을 무한히 반복해 M을 쌓는다'],
    [0.72,'④ 쌓인 M들이 이루는 분포 — 이것이 표집분포다'],
  ];
  let msg = beats[0][1];
  for (const [at,s] of beats) if (t >= at) msg = s;
  text(msg, 640, 600, 26, NAVY, 700, 'center');
  text('표집분포는 사람들의 점수가 모인 분포가 아니라, 표본평균이라는 통계치가 모인 분포다',
       640, 640, 17, SOFT, 500, 'center');
};
document.fonts.ready.then(() => { window.__ready = true; window.renderFrame(0); });
</script>
